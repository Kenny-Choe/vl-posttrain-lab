name: CPU contracts and package
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[images,numerical]"
      - run: python -m pip install "setuptools>=68" wheel
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/verify.py
      - run: python tools/verify_installed.py
      - run: python tools/package_release.py
